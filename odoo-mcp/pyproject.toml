[project]
name = "odoo-mcp"
version = "0.1.0"
description = "MCP server de solo lectura para Odoo (proyectos, tareas, actividades, chatter)"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2",
  "python-dotenv>=1.0",
  "uvicorn>=0.30",
  "starlette>=0.40",
]

[project.scripts]
odoo-mcp = "odoo_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["odoo_mcp"]
